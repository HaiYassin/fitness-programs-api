services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: fitness_api_app
        restart: unless-stopped
        working_dir: /var/www/html
        environment:
            APP_ENV: dev
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
            - ./docker/php/conf.d/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini
        depends_on:
            database:
                condition: service_healthy
        networks:
            - fitness_network

    webserver:
        image: nginx:alpine
        container_name: fitness_api_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./docker/nginx/conf.d/:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - fitness_network

    database:
        image: mysql:8.0
        container_name: fitness_api_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: fitness_programs_db
            MYSQL_USER: fitness_user
            MYSQL_PASSWORD: fitness_password
            MYSQL_ROOT_PASSWORD: root_password
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - fitness_network

    phpmyadmin:
        image: arm64v8/phpmyadmin
        container_name: fitness_api_phpmyadmin
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: database
            PMA_USER: fitness_user
            PMA_PASSWORD: fitness_password
        depends_on:
            - database
        networks:
            - fitness_network

networks:
    fitness_network:
        driver: bridge

volumes:
    db_data:
